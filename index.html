<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GBBO Fantasy League</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f8fc;--card:#fff;--ink:#1c2b39;--mute:#5d6f80;--line:#d5e2ee;--blue:#2c6e9f;--berry:#c4245f;--butter:#f5cf5b;--neg:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121c26;--card:#1a2733;--ink:#e8f0f7;--mute:#98abbd;--line:#2b3e50;--blue:#6fb0e0;--berry:#ff7aa5;--butter:#f5cf5b;--neg:#ff8a80}}
:root[data-theme="dark"]{--bg:#121c26;--card:#1a2733;--ink:#e8f0f7;--mute:#98abbd;--line:#2b3e50;--blue:#6fb0e0;--berry:#ff7aa5;--butter:#f5cf5b;--neg:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
header{background:repeating-linear-gradient(90deg,var(--blue) 0 14px,transparent 14px 28px),var(--blue);background-size:auto;position:relative;padding:36px 20px 28px;color:#fff;
background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 14px,transparent 14px 28px),repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 14px,transparent 14px 28px)}
header div{max-width:880px;margin:auto}
h1{font:800 clamp(2rem,6vw,3.2rem)/1.05 Fraunces,Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;opacity:.92;max-width:52ch}
nav{display:flex;gap:6px;max-width:880px;margin:18px auto 0;padding:0 16px;overflow-x:auto}
nav button{font:500 .95rem "DM Sans",sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--berry);border-color:var(--berry);color:#fff}
nav button:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
main{max-width:880px;margin:18px auto 48px;padding:0 16px}
section{display:none}section.on{display:block}
h2{font:600 1.5rem Fraunces,Georgia,serif;margin:8px 0 12px}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lb li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.lb li:first-child{border-color:var(--butter);box-shadow:0 0 0 3px color-mix(in srgb,var(--butter) 45%,transparent)}
.rk{font:800 1.9rem Fraunces,serif;color:var(--blue);text-align:center}
.nm{font-weight:700;font-size:1.1rem}.ro{color:var(--mute);font-size:.92rem}
.tot{font:800 2rem Fraunces,serif;text-align:right;line-height:1}.tot small{display:block;font:400 .75rem "DM Sans";color:var(--mute);margin-top:2px}
.neg{color:var(--neg)}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:.85rem;color:var(--mute)}
.chips b{color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--berry)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:.95rem}
th{font-weight:700;color:var(--mute);font-size:.85rem;background:color-mix(in srgb,var(--blue) 8%,var(--card))}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--mute)}
.note{color:var(--mute);font-size:.88rem;margin-top:10px}
.pl{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
</style>
</head>
<body>
<header><div>
<h1>GBBO Fantasy League</h1>
<p>Four players, twelve bakers, one tent. Standings update after every episode.</p>
</div></header>
<nav role="tablist" aria-label="Sections">
<button role="tab" aria-selected="true" data-t="lb">Leaderboard</button>
<button role="tab" aria-selected="false" data-t="wk">Weekly scores</button>
<button role="tab" aria-selected="false" data-t="bk">Baker totals</button>
</nav>
<main>
<section id="lb" class="on"><h2>Leaderboard</h2><ol class="lb" id="lbList"></ol>
<p class="note">Ties break on Star Baker points.</p></section>
<section id="wk"><h2>Weekly scores</h2><div id="wkBody"></div></section>
<section id="bk"><h2>Baker totals</h2><div id="bkBody"></div></section>
</main>
<script>
// ---- Edit this block after each episode ----
var PLAYERS=[
 {name:"KT",roster:["Gabe","Gary","Mo"],weekly:38,bonus:0,star:5,left:3},
 {name:"Matt",roster:["Clara","Danni","Tom"],weekly:31,bonus:0,star:20,left:1},
 {name:"AC",roster:["Connie","Moyin","Yannis"],weekly:28,bonus:0,star:5,left:2},
 {name:"Justin",roster:["Molly","Nikki","Shannon"],weekly:-20,bonus:0,star:0,left:0}
];
// Per-episode scores and highlights (hs = handshake)
var WEEKS=[
 {ep:1,KT:13,Matt:4,AC:3,Justin:-7,star:"Mo",tw:"Tom",out:"None"},
 {ep:2,KT:3,Matt:2,AC:5,Justin:3,star:"Tom",tw:"Connie",out:"Danni"},
 {ep:3,KT:11,Matt:9,AC:7,Justin:-10,star:"Clara",tw:"Gabe",hs:"Moyin",out:"Shannon"},
 {ep:4,KT:5,Matt:9,AC:2,Justin:-6,star:"Tom",tw:"Gabe",out:"Molly (eliminated), Nikki (left the show)"},
 {ep:5,KT:4,Matt:2,AC:5,Justin:0,star:"Connie",tw:"Gary",hs:"Connie",out:"Yannis"},
 {ep:6,KT:2,Matt:5,AC:6,Justin:0,star:"Tom",tw:"Moyin",hs:"Tom",out:"Clara"}
];
// Per-baker points by episode, technical rank by episode, out = episode eliminated
var BAKERS=[
 {name:"Clara",pts:[1,0,8,4,1,-8],tech:[8,10,3,2,3,7],out:6,risk:[5]},
 {name:"Connie",pts:[1,6,1,1,13,0],tech:[6,1,6,5,2,6]},
 {name:"Danni",pts:[-3,-6],tech:[11,11],out:2,risk:[1]},
 {name:"Gabe",pts:[4,1,6,6,1,4],tech:[3,6,1,1,4,3]},
 {name:"Gary",pts:[4,-2,1,-2,3,1],tech:[2,12,8,9,1,4],risk:[5]},
 {name:"Mo",pts:[5,4,4,1,0,-3],tech:[4,2,2,6,6,5],risk:[6]},
 {name:"Molly",pts:[-5,1,-3,-6],tech:[12,7,10,7],out:4,risk:[1,3]},
 {name:"Moyin",pts:[1,1,6,4,-2,6],tech:[9,4,5,3,8,1]},
 {name:"Nikki",pts:[1,1,1],tech:[5,9,4],out:4,left:1},
 {name:"Shannon",pts:[-3,1,-8],tech:[10,5,11],out:3,risk:[1]},
 {name:"Tom",pts:[6,8,1,5,1,13],tech:[1,3,7,4,4,2]},
 {name:"Yannis",pts:[1,-2,0,-3,-6],tech:[7,8,9,8,7],out:5,risk:[2,4]}
];
// --------------------------------------------
var COL={KT:"#2c6e9f",Matt:"#c4245f",AC:"#d19a00",Justin:"#4a8f6a"};
function tot(p){return p.weekly+p.bonus}
var ranked=PLAYERS.slice().sort(function(a,b){return tot(b)-tot(a)||b.star-a.star});
var max=Math.max.apply(null,ranked.map(function(p){return Math.abs(tot(p))}))||1;
document.getElementById("lbList").innerHTML=ranked.map(function(p,i){
 var t=tot(p);
 return '<li><div class="rk">'+(i+1)+'</div><div><div class="nm">'+p.name+'</div><div class="ro">'+p.roster.join(", ")+
 '</div><div class="chips"><span>Weekly <b>'+p.weekly+'</b></span><span>Bonus <b>'+p.bonus+'</b></span><span>Star Baker <b>'+p.star+'</b></span><span>Bakers left <b>'+p.left+' of 3</b></span></div>'+
 '<div class="bar"><i style="width:'+Math.max(4,Math.abs(t)/max*100)+'%"></i></div></div>'+
 '<div class="tot'+(t<0?' neg':'')+'">'+t+'<small>points</small></div></li>';}).join("");
var wk=document.getElementById("wkBody");
var names=PLAYERS.map(function(p){return p.name});
var run={};names.forEach(function(n){run[n]=0});
var rows=WEEKS.map(function(w){return '<tr><td>Ep '+w.ep+'</td>'+names.map(function(n){run[n]+=w[n]||0;return '<td class="n'+((w[n]||0)<0?' neg':'')+'">'+(w[n]||0)+'</td>'}).join("")+'<td>'+w.star+'</td><td>'+w.tw+'</td><td>'+w.out+'</td></tr>'}).join("");
var sum='<tr><th>Total</th>'+names.map(function(n){return '<th class="n'+(run[n]<0?' neg':'')+'">'+run[n]+'</th>'}).join("")+'<th></th><th></th><th></th></tr>';
wk.innerHTML='<div class="wrap"><table><thead><tr><th>Episode</th>'+names.map(function(n){return '<th class="n"><span class="pl" style="background:'+COL[n]+'"></span>'+n+'</th>'}).join("")+'<th>Star Baker</th><th>Tech win</th><th>Out</th></tr></thead><tbody>'+rows+sum+'</tbody></table></div><p class="note">Handshake: '+WEEKS.filter(function(w){return w.hs}).map(function(w){return w.hs+' (Ep '+w.ep+')'}).join(", ")+'</p>';
var bk=document.getElementById("bkBody");
var owner={};PLAYERS.forEach(function(p){p.roster.forEach(function(b){owner[b]=p.name})});
var nEp=WEEKS.length;
var list=BAKERS.map(function(b){var t=b.pts.reduce(function(x,y){return x+y},0);var avg=b.tech.reduce(function(x,y){return x+y},0)/b.tech.length;
var st={sb:0,tw:0,t3:0,b3:0,rk:(b.risk||[]).length,tl:0};
WEEKS.forEach(function(w){if(w.star===b.name)st.sb++});
b.tech.forEach(function(rk,i){var N=BAKERS.filter(function(x){return x.tech[i]!==undefined}).length;if(rk===1)st.tw++;if(rk<=3)st.t3++;if(rk>=N-2)st.b3++;if(rk===N)st.tl++});
return {b:b,total:t,avg:avg,st:st}});
list.sort(function(x,y){return y.total-x.total||x.b.name.localeCompare(y.b.name)});
var eh="";for(var i=1;i<=nEp;i++)eh+='<th class="n">Ep '+i+'</th>';
bk.innerHTML='<div class="wrap"><table><thead><tr><th>Baker</th><th>Drafted by</th>'+eh+'<th class="n">Total</th><th class="n">Star Baker</th><th class="n">Tech wins</th><th class="n">Tech top 3</th><th class="n">Tech bottom 3</th><th class="n">Last in tech</th><th class="n">At risk</th><th class="n">Avg tech rank</th><th>Status</th></tr></thead><tbody>'+
 list.map(function(r){var b=r.b,o=owner[b.name];var cells="";for(var i=0;i<nEp;i++){var v=b.pts[i];cells+='<td class="n'+(v<0?' neg':'')+'">'+(v===undefined?'–':v)+'</td>'}
 return '<tr><td><b>'+b.name+'</b></td><td><span class="pl" style="background:'+COL[o]+'"></span>'+o+'</td>'+cells+'<td class="n"><b'+(r.total<0?' class="neg"':'')+'>'+r.total+'</b></td><td class="n">'+r.st.sb+'</td><td class="n">'+r.st.tw+'</td><td class="n">'+r.st.t3+'</td><td class="n">'+r.st.b3+'</td><td class="n">'+r.st.tl+'</td><td class="n">'+r.st.rk+'</td><td class="n">'+r.avg.toFixed(1)+'</td><td>'+(b.out?(b.left?'Left Ep ':'Out Ep ')+b.out:'In')+'</td></tr>'}).join("")+'</tbody></table></div><p class="note">Tech top 3 includes wins. Tech bottom 3 is the last three places that week. Avg tech rank: lower is better.</p>';
var tabs=document.querySelectorAll("nav button");
tabs.forEach(function(t){t.addEventListener("click",function(){
 tabs.forEach(function(x){x.setAttribute("aria-selected",x===t)});
 document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===t.dataset.t)});
})});
</script>
</body>
</html>
